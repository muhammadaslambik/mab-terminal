<script>
(function(){
const ESC=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const CAC=window.CAC={st:'idle',data:null,at:0,err:null,flt:'inti',open:null};
const HL={st:'idle',data:null,err:null,at:0};
async function api(path){
  const r=await fetch(path,{cache:'no-store'});
  if(!r.ok){let m='';try{m=(await r.json()).error||''}catch(_e){}throw new Error('HTTP '+r.status+(m?': '+m:''))}
  return r.json();
}
const isN=v=>typeof v==='number'&&isFinite(v);
const wib=iso=>{if(!iso)return '—';const d=new Date(iso);if(isNaN(d))return '—';return d.toLocaleString('id-ID',{timeZone:'Asia/Jakarta',hour12:false,day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})+' WIB'};
const ageH=iso=>{const t=Date.parse(iso);return isFinite(t)?(Date.now()-t)/3600000:Infinity};
const ago=iso=>{const h=ageH(iso);if(!isFinite(h))return '';return h<1?Math.round(h*60)+' mnt lalu':h<48?Math.round(h)+' jam lalu':Math.round(h/24)+' hari lalu'};
const pct=(v,d=1)=>isN(v)?v.toFixed(d)+'%':'—';
const idr=v=>!isN(v)?'—':v>=1e9?'Rp'+(v/1e9).toFixed(1)+' M':'Rp'+Math.round(v/1e6)+' jt';
const TIERC={inti:'var(--g)',gugur:'var(--r)',belum_ada_intel:'var(--a)'};
const TIERL=()=>({inti:'INTI',gugur:S('GUGUR','OUT'),belum_ada_intel:S('BELUM ADA INTEL','NO INTEL')});
const safeUrl=u=>typeof u==='string'&&/^https:\/\//i.test(u)?u:null;
function redraw(){if(typeof M!=='undefined'&&M[cur]&&M[cur].k==='cacing'){const y=scrollY;draw();scrollTo(0,y)}}
window.cacLoad=async function(force){
  if(CAC.st==='loading')return;
  if(!force&&CAC.st==='ok'&&Date.now()-CAC.at<300000)return;
  CAC.st='loading';CAC.err=null;redraw();
  try{CAC.data=await api('/api/idx/cacing');CAC.at=Date.now();CAC.st='ok'}
  catch(e){CAC.st='err';CAC.err=String(e&&e.message||e)}
  redraw();
};
window.cacTog=function(c){CAC.open=CAC.open===c?null:c;redraw()};
window.cacFlt=function(f){CAC.flt=f;redraw()};
function detail(c){
  const i=c.intel,l=c.liquidity||{},fc=c.floatCheck||{},parts=[];
  if(c.reasons&&c.reasons.length)parts.push(`<div><b class="r">${S('Alasan gugur','Reasons out')}:</b> ${c.reasons.map(ESC).join('; ')}</div>`);
  if(c.warnings&&c.warnings.length)parts.push(`<div><b style="color:var(--a)">${S('Peringatan','Warnings')}:</b> ${c.warnings.map(ESC).join('; ')}</div>`);
  parts.push(`<div class="m">${S('Harga','Price')} ${ESC(c.close)} | PBV ${ESC(c.pbv)} | ${S('Harga/NAV','Price/NAV')} ${ESC(c.priceToNav)} | ${S('Liabilitas','Liabilities')} Rp${ESC(c.liabilitiesBn)} M | ${S('Ekuitas','Equity')} Rp${ESC(c.equityBn)} M</div>`);
  parts.push(`<div class="m">${S('Likuiditas','Liquidity')}: ${ESC(l.status)} | ${S('nilai','value')} ${idr(l.valueIdr)} | vol ${ESC(l.volume)} | freq ${ESC(l.frequency)} | ${S('data tanggal','data date')} ${ESC(String(l.lastDate||'').slice(0,10))} | unit: ${ESC(l.unitCheck)}</div>`);
  parts.push(`<div class="m">${S('Cek float','Float check')}: TradingView ${pct(fc.tradingview)} | Pasardana ${pct(fc.pasardana)} | IDX ${pct(fc.idxPublic)} | ${S('selisih','gap')} ${isN(fc.gapPts)?fc.gapPts+' poin':'—'}${fc.flag?' <span style="color:var(--a)">⚑ '+ESC(fc.flag)+'</span>':''}</div>`);
  if(i){
    parts.push(`<div class="m">${S('Intel IDX','IDX intel')}: ${S('laporan keuangan','fin. statements')} ${ESC(i.fsDate)} | DER ${ESC(i.der)} | ${S('diterima','received')} ${wib(i.receivedAt)}</div>`);
    if(i.holders&&i.holders.length)parts.push(`<div style="margin-top:4px">${i.holders.map(h=>`<div class="row" style="grid-template-columns:1fr 70px"><span>${ESC(h.nama)} <span class="m">(${ESC(h.kategori)})</span></span><span>${pct(h.pct,2)}</span></div>`).join('')}</div>`);
    if(i.announcements&&i.announcements.length)parts.push(`<div style="margin-top:6px"><b>${S('Pengumuman','Announcements')}</b> <span class="m">(${S('judul bukan konfirmasi; baca PDF','titles are not confirmation; read the PDF')})</span>${i.announcements.map(a=>{const u=safeUrl(a.pdf);return `<div>${ESC(a.date)} <span class="m">[${ESC(a.level)}]</span> ${u?`<a href="${ESC(u)}" target="_blank" rel="noopener noreferrer" style="color:var(--c)">${ESC(a.title)}</a>`:ESC(a.title)}</div>`}).join('')}</div>`);
  }else parts.push(`<div class="m">${S('Belum ada intel IDX untuk emiten ini (jalankan kolektor).','No IDX intel for this issuer yet (run the collector).')}</div>`);
  return parts.join('');
}

  const head=`<div class="bar"><h2>${S('Cacing-Naga — Daftar Pantauan','Worm-Dragon — Watchlist')} <small class="livb">${S('DATA NYATA','LIVE DATA')}</small></h2><div class="cacbtn"><button onclick="cacLoad(true)">${S('Muat ulang','Reload')}</button></div></div>`;
  if(CAC.st==='err')return head+`<div class="card"><b class="r">${S('Gagal memuat dari backend','Failed to load from backend')}</b><div class="m">${ESC(CAC.err)}</div><div class="m" style="margin-top:6px">${S('Periksa Pages Function /api dan secret API_TOKEN di proyek Pages.','Check the /api Pages Function and the API_TOKEN secret in the Pages project.')}</div></div>`;
  const d=CAC.data;
  if(!d)return head+`<div class="card m">${S('Memuat data dari backend…','Loading data from backend…')}</div>`;
  const j=d.judgement||{},t=j.tiers||{},rules=j.rules||{},lq=d.liquidity||{},cs=d.candidates||[];

  const tr=rows.map(c=>{

    const main=`<tr class="cr" data-c="${ESC(c.code)}" onclick="cacTog(this.dataset.c)"><td><b style="color:var(--w)">${ESC(c.code)}</b><br><span class="m" style="font-size:12px">${ESC(c.name||'')}</span></td><td><span class="badge" style="background:${TIERC[c.tier]||'var(--m)'}">${ESC(tl[c.tier]||c.tier)}</span></td><td>${ESC(c.marketCapBn)}</td><td>${ESC(der)}</td><td>${pct(a&&a.publicPct)}</td><td>${pct(a&&a.ownerPct)}</td><td style="text-align:left">${top?ESC(top.name)+' '+pct(top.pct):'—'}</td><td class="${isN(oy)?(oy>-0.4?(oy>=0?'g':''):'r'):'m'}">${isN(oy)?(oy>=0?'+':'')+Math.round(oy*100)+'%':'—'}</td><td${l.status&&l.status!=='ok'?' style="color:var(--a)"':''}>${idr(l.valueIdr)}</td></tr>`;

  }).join('');
  const table=`<div class="card tbl"><table><tr class="m">${th.map(x=>`<th>${x}</th>`).join('')}</tr>${tr||`<tr><td colspan="9" class="m">${S('Tidak ada emiten pada filter ini.','No issuers in this filter.')}</td></tr>`}</table><div class="m" style="margin-top:8px">${S('Klik baris untuk rincian. Daftar pantauan, bukan sinyal beli; bukan nasihat investasi.','Click a row for details. Watchlist, not a buy signal; not investment advice.')}</div></div>`;
  return head+meta+tiles+flt+table;

<script>
(function(){

const ageH=iso=>{const t=Date.parse(iso);return isFinite(t)?(Date.now()-t)/3600000:Infinity};

function redraw(){if(typeof M!=='undefined'&&M[cur]&&(M[cur].k==='home'||M[cur].k==='pasar'||M[cur].k==='price')){const y=scrollY;draw();scrollTo(0,y)}}

function trendSvg(ov){
  const regs=(ov.quotes||[]).filter(x=>x.group==='index'&&x.ok===true&&Array.isArray(x.closes)&&Array.isArray(x.times)&&x.closes.length>1);
  if(regs.length<2)return '';
  const dk=t=>new Date(t*1000).toISOString().slice(0,10);
  const dates=Array.from(new Set(regs.flatMap(r=>r.times.map(dk)))).sort().slice(-40);
  const series=regs.map(r=>{const byD=new Map();r.times.forEach((t,i)=>byD.set(dk(t),r.closes[i]));let last=null;const arr=dates.map(d=>{if(byD.has(d))last=byD.get(d);return last});const base=arr.find(v=>v!==null);return {id:r.id,label:r.label,vals:arr.map(v=>v===null||!base?null:v/base*100)}});
  const all=series.flatMap(s=>s.vals).filter(v=>v!==null);const lo=Math.min(...all,100),hi=Math.max(...all,100),pad=(hi-lo)*.08||1,y0=lo-pad,y1=hi+pad;
  const W=640,H=260,L=44,R=12,T=10,B=26,X=i=>L+(W-L-R)*i/(dates.length-1),Y=v=>T+(H-T-B)*(1-(v-y0)/(y1-y0));

  const xl=`<text x="${L}" y="${H-6}" fill="#9a8f7e" font-size="11">${dates[0]}</text><text x="${W-R}" y="${H-6}" text-anchor="end" fill="#9a8f7e" font-size="11">${dates[dates.length-1]}</text>`;
  const legend=series.map((s,k)=>{const lv=[...s.vals].reverse().find(v=>v!==null);return `<span style="margin-right:14px;white-space:nowrap"><span style="color:${PL[k%PL.length]}">●</span> ${ESC(s.id)} <span class="${cls(lv-100)}">${isN(lv)?sp(lv-100):'—'}</span></span>`}).join('');

}

    if(n.corporateAction)panel.appendChild(el('div','display:inline-block;background:#e8a33d;color:#120d07;padding:1px 8px;border-radius:3px;margin-bottom:10px;font-size:12px','AKSI KORPORASI (kata kunci pada judul)'));
    var s=(n.summary||'').trim();

    panel.appendChild(el('div','color:#9a8d77;font-size:12px;margin-bottom:12px','Cuplikan dari RSS media, bukan rangkuman isi artikel penuh dan bukan konfirmasi. Baca sumbernya.'));

      var a=el('a','display:inline-block;border:1px solid #e8a33d;color:#e8a33d;padding:4px 12px;border-radius:4px;text-decoration:none','Buka sumber');
