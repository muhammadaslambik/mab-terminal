<script id="news-panel-js">
/* Panel rangkuman berita: klik judul berita -> panel di kanan (tanpa tab baru). Data dari RD.nw.items (RSS apa adanya). */
(function(){
  var panel=null;
  function norm(u){try{return new URL(u,location.href).href}catch(e){return ''}}
  function find(href){
    var items=(window.RD&&RD.nw&&Array.isArray(RD.nw.items))?RD.nw.items:[];
    var h=norm(href);
    for(var i=0;i<items.length;i++){if(norm(items[i].link)===h)return items[i]}
    return null;
  }
  function el(tag,css,text){var e=document.createElement(tag);if(css)e.style.cssText=css;if(text!=null)e.textContent=text;return e}
  function close(){if(panel){panel.remove();panel=null}}
  function open(n){
    close();
    panel=el('div','position:fixed;top:0;right:0;bottom:0;width:min(420px,92vw);z-index:9999;background:#120d07;color:#eadfca;border-left:2px solid #e8a33d;box-shadow:-8px 0 24px rgba(0,0,0,.6);overflow:auto;padding:16px;font:14px/1.5 inherit');
    panel.id='news-panel';
    var top=el('div','display:flex;justify-content:space-between;align-items:center;margin-bottom:10px');
    top.appendChild(el('span','color:#e8a33d;font-weight:bold;letter-spacing:1px','RANGKUMAN BERITA'));
    var x=el('button','background:none;border:1px solid #e8a33d;color:#e8a33d;cursor:pointer;padding:2px 10px;border-radius:4px','Tutup X');
    x.onclick=close;top.appendChild(x);panel.appendChild(top);
    panel.appendChild(el('div','font-size:16px;font-weight:bold;margin-bottom:8px',n.title));
    var t='';try{t=new Date(n.time).toLocaleString('id-ID',{timeZone:'Asia/Jakarta',day:'numeric',month:'short',year:'numeric',hour:'2-digit',minute:'2-digit'})+' WIB'}catch(e){}
    panel.appendChild(el('div','color:#8fd3e8;margin-bottom:10px',(n.source||'')+(t?' | '+t:'')));
    if(n.corporateAction)panel.appendChild(el('div','display:inline-block;background:#e8a33d;color:#120d07;padding:1px 8px;border-radius:3px;margin-bottom:10px;font-size:12px','AKSI KORPORASI (kata kunci pada judul)'));
    var s=(n.summary||'').trim();
    panel.appendChild(el('div','white-space:pre-wrap;margin-bottom:12px',s||'(Sumber tidak menyertakan deskripsi pada RSS-nya.)'));
    panel.appendChild(el('div','color:#9a8d77;font-size:12px;margin-bottom:12px','Cuplikan dari RSS media, bukan rangkuman isi artikel penuh dan bukan konfirmasi. Baca sumbernya.'));
    if(/^https:\/\//i.test(n.link||'')){
      var a=el('a','display:inline-block;border:1px solid #e8a33d;color:#e8a33d;padding:4px 12px;border-radius:4px;text-decoration:none','Buka sumber');
      a.href=n.link;a.target='_blank';a.rel='noopener noreferrer';panel.appendChild(a);
    }
    document.body.appendChild(panel);
  }
  document.addEventListener('click',function(ev){
    var a=ev.target&&ev.target.closest?ev.target.closest('a[href]'):null;
    if(!a||(panel&&panel.contains(a)))return;
    var n=find(a.getAttribute('href'));
    if(!n)return;
    ev.preventDefault();ev.stopPropagation();open(n);
  },true);
  document.addEventListener('keydown',function(ev){if(ev.key==='Escape')close()});
})();
</script>
