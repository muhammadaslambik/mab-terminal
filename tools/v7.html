<script id="v7-js">
/* 7 menu: Beranda, Arus Global, Saham Indonesia, Saham Amerika, XAUUSD, Crypto, Berita. Data nyata dari RD (overview + news). */
(function(){
const E=s=>String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const dec=s=>String(s==null?'':s).replace(/&#x([0-9a-f]+);/gi,(m,h)=>{try{return String.fromCodePoint(parseInt(h,16))}catch(e){return ''}}).replace(/&#(\d+);/g,(m,d)=>{try{return String.fromCodePoint(+d)}catch(e){return ''}});
const isN=v=>typeof v==='number'&&isFinite(v);
const nf=v=>isN(v)?v.toLocaleString('en-US',{maximumFractionDigits:Math.abs(v)<10?4:2}):'—';
const sp=v=>isN(v)?(v>0?'+':'')+v.toFixed(1)+'%':'—';
const cl=v=>!isN(v)||Math.abs(v)<.05?'m':v>0?'g':'r';
const ageH=iso=>{const t=Date.parse(iso);return isFinite(t)?(Date.now()-t)/36e5:Infinity};
const ago=iso=>{const h=ageH(iso);return !isFinite(h)?'':h<1?Math.max(1,Math.round(h*60))+' mnt':h<48?Math.round(h)+' jam':Math.round(h/24)+' hari'};
const wib=iso=>{const d=new Date(iso);return isNaN(d)?'—':d.toLocaleString('id-ID',{timeZone:'Asia/Jakarta',hour12:false,day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'})+' WIB'};
const safe=u=>typeof u==='string'&&/^https:\/\//i.test(u)?u:null;
const qAny=id=>RD.ov&&Array.isArray(RD.ov.quotes)?RD.ov.quotes.find(x=>x.id===id)||null:null;
const q=id=>{const x=qAny(id);return x&&x.ok===true?x:null};
const NV={tr:false,per:'m1',sel:{id:'BBCA',us:'AAPL',xau:'PAXG',cry:'BTC'},cac:false,sig:{}};
const G=()=>(RD.nw&&RD.nw.global)||{};
const NEWS={indonesia:()=>(RD.nw&&RD.nw.items)||[],amerika:()=>G().amerika||[],dunia:()=>G().dunia||[],crypto:()=>G().crypto||[],xauusd:()=>G().xauusd||[]};
const allNews=()=>[].concat(NEWS.indonesia(),NEWS.amerika(),NEWS.dunia(),NEWS.crypto(),NEWS.xauusd());
const ttl=n=>dec(NV.tr&&n.titleId?n.titleId:n.title);
const rd=()=>draw(true);
const head=t=>`<div class="bar"><h2>${t} <small class="livb">${S('DATA NYATA','LIVE DATA')}</small></h2><div class="cacbtn"><button onclick="rdLoad(true)">${S('Muat ulang','Reload')}</button></div></div>`;
/* ---- berita ---- */
const trTog=()=>`<span class="chip ${!NV.tr?'on':''}" onclick="v7.tr(false)">${S('Judul Asli','Original')}</span><span class="chip ${NV.tr?'on':''}" onclick="v7.tr(true)">${S('Terjemahan','Translated')}</span>`;
function srcWarn(cat){const s=(RD.nw&&RD.nw.sources)||[];return s.filter(x=>x.category===cat&&(x.stale||!x.ok)).map(x=>`<div style="color:var(--a)">⚠ ${E(x.name)}: ${!x.ok?S('gagal diambil','fetch failed'):S('berita terbaru '+ago(x.newest)+' lalu (basi)','latest item '+ago(x.newest)+' ago (stale)')}</div>`).join('')}
function rows(list,lim){return list.slice(0,lim).map(n=>{const u=safe(n.link);const t=E(ttl(n));return `<div class="row" style="grid-template-columns:104px 108px 1fr"><span class="m">${wib(n.time)}</span><span style="color:var(--c)">${E(n.source)}</span><span>${n.corporateAction?`<span class="badge" style="background:var(--a);margin-right:6px">${S('AKSI KORPORASI','CORP. ACTION')}</span>`:''}${u?`<a href="${E(u)}" target="_blank" rel="noopener noreferrer" style="color:inherit">${t}</a>`:t}</span></div>`}).join('')||`<div class="m">${S('Belum ada berita.','No news yet.')}</div>`}
function newsCard(title,cat,list,lim,noTog){const fg=cat!=='indonesia';return `<div class="card"><div class="ph">${title}</div>${fg&&!noTog?`<div class="tf" style="position:static;margin:0 0 8px;padding:0;background:none"><div class="tfs">${trTog()}</div></div>`:''}${fg&&NV.tr?`<div class="m" style="color:var(--a);margin-bottom:6px">${S('Terjemahan mesin, bisa keliru. Cek judul asli.','Machine translation, may be wrong. Check the original title.')}</div>`:''}<div style="max-height:62vh;overflow:auto">${rows(list,lim)}</div>${srcWarn(cat)}</div>`}
/* ---- analisa teknikal dari penutupan harian ---- */
function an(x){const c=(x.closes||[]).filter(isN),n=c.length;if(n<6)return null;const last=c[n-1],sm=k=>n>=k?c.slice(-k).reduce((a,b)=>a+b,0)/k:null,s5=sm(5),s20=sm(20);let rsi=null;if(n>=15){let g=0,l=0;for(let i=n-14;i<n;i++){const d=c[i]-c[i-1];d>0?g+=d:l-=d}rsi=l?100-100/(1+g/l):100}const hi=Math.max(...c),lo=Math.min(...c),pos=hi>lo?(last-lo)/(hi-lo):.5,ch=k=>n>k?(last/c[n-1-k]-1)*100:null,r=[];for(let i=1;i<n;i++)r.push(c[i]/c[i-1]-1);const mu=r.reduce((a,b)=>a+b,0)/r.length,vol=Math.sqrt(r.reduce((a,b)=>a+(b-mu)*(b-mu),0)/r.length)*100,trend=s20&&s5?(last>s20&&s5>s20?'naik':last<s20&&s5<s20?'turun':'sideways'):'belum jelas';return{n,last,s20,rsi,hi,lo,pos,c5:ch(5),c20:ch(20),vol,trend}}
function anHtml(x){const a=an(x);if(!a)return `<div class="m">${S('Riwayat harga belum cukup.','Not enough price history.')}</div>`;const tT={naik:S('naik','up'),turun:S('turun','down'),sideways:'sideways','belum jelas':S('belum jelas','unclear')}[a.trend],rz=a.rsi==null?'—':a.rsi>70?S('jenuh beli','overbought'):a.rsi<30?S('jenuh jual','oversold'):S('netral','neutral'),pz=a.pos>.8?S('dekat puncak periode','near the period high'):a.pos<.2?S('dekat dasar periode','near the period low'):S('di tengah rentang','mid-range');return `<div>${S('Tren jangka pendek','Short-term trend')}: <b>${tT}</b> (${nf(a.last)} vs ${S('rata-rata 20 hari','20-day average')} ${a.s20?nf(a.s20):'—'})</div><div>RSI 14: <b>${a.rsi==null?'—':a.rsi.toFixed(0)}</b> (${rz})</div><div>${S('Posisi dalam rentang','Position in range')} ${a.n} ${S('hari','days')}: <b>${Math.round(a.pos*100)}%</b> (${pz}); ${S('terendah','low')} ${nf(a.lo)}, ${S('tertinggi','high')} ${nf(a.hi)}</div><div>${S('Perubahan','Change')} 5 ${S('hari','d')}: <span class="${cl(a.c5)}">${sp(a.c5)}</span> | 20 ${S('hari','d')}: <span class="${cl(a.c20)}">${sp(a.c20)}</span> | ${S('Volatilitas harian','Daily volatility')} ${a.vol.toFixed(2)}%</div><div class="m" style="margin-top:6px">${S('Dihitung dari penutupan harian (maks 41 hari, belum cukup untuk rata-rata 50 hari). Daftar pantauan, bukan sinyal beli/jual dan bukan nasihat investasi.','Computed from daily closes (max 41 days, not enough for a 50-day average). Watchlist, not a buy/sell signal and not investment advice.')}</div>`}
function chart(x){const c=x.closes||[],t=x.times||[],n=c.length;if(n<2)return '';const W=640,H=240,L=58,R=12,T=10,B=26,mn=Math.min(...c),mx=Math.max(...c),X=i=>L+(W-L-R)*i/(n-1),Y=v=>T+(H-T-B)*(1-(v-mn)/((mx-mn)||1)),m20=c.map((_,i)=>i>=19?c.slice(i-19,i+1).reduce((a,b)=>a+b,0)/20:null),pl=a=>a.map((v,i)=>v==null?null:X(i).toFixed(1)+','+Y(v).toFixed(1)).filter(Boolean).join(' '),dd=i=>{const z=new Date(t[i]*1000);return isNaN(z)?'':z.toISOString().slice(0,10)},gr=[0,.25,.5,.75,1].map(f=>{const v=mn+(mx-mn)*f;return `<line x1="${L}" x2="${W-R}" y1="${Y(v)}" y2="${Y(v)}" stroke="#ffffff14"/><text x="${L-6}" y="${Y(v)+4}" text-anchor="end" fill="#9a8f7e" font-size="11">${nf(v)}</text>`}).join('');return `<div style="overflow-x:auto"><svg viewBox="0 0 ${W} ${H}" style="min-width:480px">${gr}<polyline fill="none" stroke="var(--t)" stroke-width="1.8" points="${pl(c)}"/><polyline fill="none" stroke="var(--c)" stroke-width="1.2" stroke-dasharray="4 3" points="${pl(m20)}"/><text x="${L}" y="${H-6}" fill="#9a8f7e" font-size="11">${dd(0)}</text><text x="${W-R}" y="${H-6}" text-anchor="end" fill="#9a8f7e" font-size="11">${dd(n-1)}</text></svg></div><div class="m">${S('Garis putus: rata-rata 20 hari. Penutupan harian (Yahoo Finance).','Dashed: 20-day average. Daily closes (Yahoo Finance).')}</div>`}
function qTable(list,title){return `<div class="card tbl"><div class="ph">${title}</div><table><tr class="m"><th>${S('INSTRUMEN','INSTRUMENT')}</th><th>${S('HARGA','PRICE')}</th><th>1D</th><th>1W</th><th>1M</th><th>3M</th><th>${S('WAKTU DATA','DATA TIME')}</th></tr>${list.map(([id,label])=>{const x=qAny(id);if(!x||x.ok!==true)return `<tr><td><b style="color:var(--w)">${E(label||id)}</b></td><td colspan="6" class="m">${x?E(x.error||'tidak tersedia'):S('tidak tersedia dari sumber','not available from source')}</td></tr>`;const p=x.perf||{},old=ageH(x.asOf)>36;return `<tr><td><b style="color:var(--w)">${E(label||id)}</b><br><span class="m" style="font-size:12px">${E(x.symbol)}</span></td><td>${nf(x.price)} <span class="m" style="font-size:12px">${E(x.currency||'')}</span></td>${['d1','w1','m1','m3'].map(k=>`<td class="${cl(p[k])}">${sp(p[k])}</td>`).join('')}<td style="text-align:left${old?';color:var(--a)':''}">${wib(x.asOf)}<br><span class="m" style="font-size:12px">${ago(x.asOf)}</span></td></tr>`}).join('')}</table></div>`}

function relNews(cat,it){const re=new RegExp('(^|[^A-Za-z0-9])'+it[0]+'([^A-Za-z0-9]|$)'),kw=(it[2]||[]).map(k=>k.toLowerCase());return NEWS[cat]().filter(n=>{const t=dec(n.title);return re.test(t)||kw.some(k=>t.toLowerCase().includes(k))})}

 const rel=relNews(cfg.cat,it);
 const nws=`<div class="gr2">${newsCard(S('BERITA TERKAIT ','NEWS ABOUT ')+E(it[0]),cfg.cat,rel,15)}${newsCard(S('BERITA ','NEWS ')+E(cfg.catLabel),cfg.cat,NEWS[cfg.cat](),20,true)}</div>`;
 return head(cfg.title)+qTable(cfg.list.map(l=>[l[0]==='XAU'?'XAU':cfg.map&&cfg.map[l[0]]||l[0],l[1]+' ('+l[0]+')']),S('HARGA NYATA','LIVE PRICES'))+tabs+detail+(cfg.after?cfg.after():'')+nws}
function sigHtml(code){const s=NV.sig[code];let b=`<button onclick="v7.sig('${code}')">${S('Muat keputusan engine','Load engine decision')}</button>`;if(!s)return b;if(s.st==='loading')return `<div class="m">${S('Memuat…','Loading…')}</div>`;if(s.st==='err')return b+`<div class="r">${E(s.err)}</div>`;const d=s.data&&s.data.signals&&s.data.signals[0]&&s.data.signals[0].decision;if(!d)return b+`<div class="m">${S('Tidak ada keputusan untuk kode ini.','No decision for this code.')}</div>`;return `<div><b>${E(d.action)}</b> (${E(d.confidence)}) — ${E(d.reason)}</div>`+(d.signals||[]).map(g=>`<div class="m">${E(g.engine)}: ${E(g.action)} (${E(g.confidence)}) ${E(g.reason||'')}</div>`).join('')}

home:()=>{const T=[['ID','IHSG'],['US','S&P 500'],['USDIDR','USD/IDR'],['XAU','Emas (GC=F)'],['WTI','WTI'],['BTC','BTC'],['ETH','ETH']],tiles=`<div class="tiles" style="margin-bottom:14px">${T.map(([id,l])=>{const x=q(id),d=x&&x.perf&&x.perf.d1;return `<div class="tile" style="background:var(--p);border:1px solid var(--b)"><span class="m">${l}</span><b style="color:var(--w)">${x?nf(x.price):'…'}</b><span class="${cl(d)}">${sp(d)}</span></div>`}).join('')}</div>`,all=(RD.ov.quotes||[]).filter(x=>x.ok===true&&x.id!=='US10Y'&&x.perf&&isN(x.perf.d1)).sort((a,b)=>b.perf.d1-a.perf.d1),li=x=>`<div><span class="${x.perf.d1>=0?'g':'r'}">${x.perf.d1>=0?'▲':'▼'}</span> ${E(x.label)} ${sp(x.perf.d1)}</div>`,mv=`<div class="card"><div class="ph">${S('PERGERAKAN TERBESAR (1 HARI)','BIGGEST MOVERS (1 DAY)')}</div>${all.slice(0,4).map(li).join('')}<hr style="border:0;border-top:1px solid var(--b)">${all.slice(-4).reverse().map(li).join('')}<div class="m">${S('Sesi terakhir tiap pasar.','Each market\'s last session.')}</div></div>`,st=`<div class="card"><div class="ph">${S('STATUS DATA','DATA STATUS')}</div><div>${S('Harga','Prices')}: ${RD.ov.okCount}/${RD.ov.total} ${S('simbol','symbols')} · ${wib(RD.ov.builtAt)} (${ago(RD.ov.builtAt)})</div>${RD.nw?`<div>${S('Berita','News')}: ${RD.nw.okFeeds}/${RD.nw.totalFeeds} ${S('sumber','sources')} · ${wib(RD.nw.builtAt)}</div>`:''}${['indonesia','amerika','dunia','crypto','xauusd'].map(srcWarn).join('')}<div class="m">${S('Bukan nasihat investasi. Daftar pantauan, bukan sinyal beli.','Not investment advice. Watchlist, not buy signals.')}</div></div>`,nw=['indonesia','amerika','dunia','crypto','xauusd'].map(c=>newsCard(c.toUpperCase(),c,NEWS[c](),c==='indonesia'?6:4)).join('');return head(S('Beranda','Home'))+tiles+`<div class="gr2">${mv}${st}</div><div class="ph" style="margin-top:6px">${S('BERITA TERKINI','LATEST NEWS')} <button class="vb" onclick="goTo(6)">${S('Semua berita →','All news →')}</button></div><div style="display:grid;grid-te
